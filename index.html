<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>

    <!-- Redirección inmediata a tu index real -->
    <meta http-equiv="refresh" content="0; url=./src/pages/about-me/index.html" />
    <link rel="canonical" href="./src/pages/about-me/index.html" />

    <!-- Fallback JS (por si el meta-refresh falla) -->
    <script>
      location.replace('./src/pages/about-me/index.html');
    </script>
    <noscript>
      <a href="./src/pages/about-me/index.html">Go to site</a>
    </noscript>
  </head>
  <body></body>
</html>
